name: Build and Release

on:
  workflow_call:
    inputs:
      snapshot:
        description: 'Build snapshot (no publishing)'
        required: false
        default: true
        type: boolean
      docker_repo:
        description: 'Docker repository'
        required: false
        default: 'ghcr.io/owenthereal/upterm/uptermd'
        type: string
      go-cache:
        description: 'Restore the Go caches, and save them on master pushes'
        required: false
        default: false
        type: boolean

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: ${{ !inputs.go-cache }}

      - name: Locate Go caches
        if: inputs.go-cache
        id: go-env
        shell: bash
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go caches
        if: inputs.go-cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-cross-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-cross-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-cross-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'amd64,arm64,ppc64le,s390x'

      - name: Login to ghcr.io
        if: ${{ !inputs.snapshot }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Run GoReleaser (Snapshot)
        if: ${{ inputs.snapshot }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --snapshot --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCKER_REPO: ${{ inputs.docker_repo }}

      - name: Run GoReleaser (Release)
        if: ${{ !inputs.snapshot }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCKER_REPO: ${{ inputs.docker_repo }}

      - name: Save Go caches
        if: always() && inputs.go-cache && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-cross-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
