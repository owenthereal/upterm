# Example Fly.io configuration for deploying your own uptermd server
# Copy this file to fly.toml and customize the app name and other settings

app = "my-uptermd-server"  # Change this to your desired app name
primary_region = "iad"     # Change to your preferred region (iad, fra, nrt, etc.)
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
# Pin to a release tag for reproducible deploys, e.g. "…/uptermd:v0.24.0".
image = "ghcr.io/owenthereal/upterm/uptermd:latest"

[env]
UPTERMD_SSH_ADDR           = "[::]:2222"
UPTERMD_WS_ADDR            = "[::]:8080"
UPTERMD_METRIC_ADDR        = "[::]:9091"
UPTERMD_SSH_PROXY_PROTOCOL = "true"
UPTERMD_NODE_ADDR          = "${FLY_MACHINE_ID}.vm.${FLY_APP_NAME}.internal:2222"
UPTERMD_ROUTING            = "auto"
# Set automatically when you attach Consul with `fly consul attach`. Left empty
# otherwise, in which case UPTERMD_ROUTING=auto selects embedded routing.
UPTERMD_CONSUL_URL         = "${FLY_CONSUL_URL:-}"
UPTERMD_CONSUL_SESSION_TTL = "1h"

# Routing Configuration:
# UPTERMD_ROUTING=auto selects Consul routing when UPTERMD_CONSUL_URL is
# non-empty, and embedded routing otherwise. Fly sets FLY_CONSUL_URL for you
# when you run `fly consul attach`, so multi-machine deployments pick up Consul
# automatically and single-machine ones need no extra configuration.

# Resource allocation - adjust based on your needs
[vm]
cpu_kind = "shared"
cpus = 1
memory_mb = 256  # Increase if you expect high usage

# SSH service (port 22)
[[services]]
protocol = "tcp"
internal_port = 2222
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1  # Start with 1 for cost efficiency

[[services.ports]]
port = 22
handlers = ["proxy_proto"]
proxy_proto_options = { version = "v2" }

[services.concurrency]
type = "connections"
hard_limit = 500   # Reduced for personal use
soft_limit = 400

[[services.tcp_checks]]
interval = "15s"
timeout = "2s"
grace_period = "5s"
restart_limit = 3

# WebSocket service (ports 80/443)  
[[services]]
protocol = "tcp"
internal_port = 8080
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1  # Start with 1 for cost efficiency

[[services.ports]]
port = 80
handlers = ["http"]
force_https = true

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[services.concurrency]
type = "connections"
hard_limit = 500   # Reduced for personal use
soft_limit = 400

[[services.http_checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
restart_limit = 3
path = "/health"
protocol = "http"