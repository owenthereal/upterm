syntax = "proto3";

package api;

option go_package = "github.com/owenthereal/upterm/host/api";

service AdminService {
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {}
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse) {}
  rpc SetJoinTimeout(SetJoinTimeoutRequest) returns (SetJoinTimeoutResponse) {}
}

message GetSessionRequest {}

// StopSessionRequest asks the session to end: the command is hung up, then
// terminated, then killed, and the record reads stopped.
message StopSessionRequest {
  // launch_id must be the launch_id of the record the caller read. A name
  // and a socket path are reused by whoever claims the name next, so they
  // do not say which run is being stopped; the launch does. The daemon
  // refuses any other value, an empty one included, so that a session that
  // ended and was replaced between the read and this call is not stopped in
  // place of the one that was inspected.
  string launch_id = 1;
}

message StopSessionResponse {}

// SetJoinTimeoutRequest sets how long the session waits for its first guest,
// counted from now, or from readiness if it is not ready yet. It replaces any
// timeout already set; zero disables it.
message SetJoinTimeoutRequest {
  // launch_id binds the request to the launch the caller read, for the reason
  // StopSessionRequest's does.
  string launch_id = 1;
  int64 timeout_nanos = 2;
}

message SetJoinTimeoutResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    COUNTING = 1; // state.deadline_unix_nano says when it fires
    PENDING = 2;  // not ready yet; state.timeout_nanos counts from readiness
    DISABLED = 3;
    CLAIMED = 4;  // a guest had joined, at state.first_guest_joined_unix_nano; nothing was set
    ENDING = 5;   // the timeout already fired, or the session is tearing down
  }
  Outcome outcome = 1;
  JoinState state = 2;
}

// JoinState is a session's join timeout. A zero field is absent.
message JoinState {
  int64 timeout_nanos = 1;                // set and not claimed
  int64 deadline_unix_nano = 2;           // counting, or the deadline that fired
  int64 first_guest_joined_unix_nano = 3; // the first guest's join
}

message GetSessionResponse {
  string session_id = 1;
  repeated string command = 2;
  repeated string force_command = 3;
  string host = 4;
  string node_addr = 5;
  repeated Client connected_clients = 6;
  repeated AuthorizedKey authorized_keys = 7;
  string ssh_user = 8; // SSH username for client connections
  bool sftp_disabled = 9; // true if SFTP is disabled (--no-sftp)
  JoinState join_state = 10; // the join timeout as the daemon holds it
  // launch_id is the launch this daemon speaks for, so a reader can tell the
  // run it read a record for from one that has since claimed the name. Empty
  // from a daemon that claimed no name, and from daemons before this field.
  string launch_id = 11;
}

message AuthorizedKey {
  repeated string public_key_fingerprints = 1;
  string comment = 2;
}

message Client {
  string id = 1;
  string version = 2;
  string addr = 3;
  string public_key_fingerprint = 4;
  // Which door the client came in by. GUEST is zero so a reader built before
  // this field existed sees every client as a guest, which is what they were.
  Kind kind = 5;

  enum Kind {
    GUEST = 0;
    HOST = 1;
  }
}

message Identifier {
  string id = 1;
  Type type = 2;
  string node_addr = 3;

  enum Type {
    HOST = 0;
    CLIENT = 1;
  }
}
